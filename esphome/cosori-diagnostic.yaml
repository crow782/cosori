# Diagnostic ESPHome configuration for the Cosori CNS-R101S.
# Store Wi-Fi credentials in secrets.yaml; never commit secrets.

esphome:
  name: cosori-scale-test
  friendly_name: Cosori Scale Test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: WARN
    esp32_ble: WARN
    esp32_ble_client: DEBUG
    ble_client: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Cosori-Scale-Recovery"
    password: !secret fallback_ap_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms

ble_client:
  - mac_address: "C0:60:40:03:9F:6D"
    id: cosori_ble
    auto_connect: true
    on_connect:
      then:
        - logger.log: "Connected to Cosori Nutrition Scale"
    on_disconnect:
      then:
        - logger.log: "Cosori Nutrition Scale disconnected"

# No bluetooth_proxy during this direct GATT-client investigation.
# GATT characteristics and weight decoding have not yet been established.
