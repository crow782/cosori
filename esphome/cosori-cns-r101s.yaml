# Cosori Nutrition Scale CNS-R101S - ESPHome firmware
#
# Confirmed BLE protocol samples:
#   0 g    -> FE EF 00 84 D0 05 00 00 00 00 01 D6
#   520 g  -> FE EF 00 84 D0 05 00 14 50 00 01 3A
#   1001 g -> FE EF 00 84 D0 05 00 27 1A 00 01 17
#
# Weight field: payload[7..8], unsigned big-endian, divided by 10.
# Raw sensor preserves 0.1 g resolution.
# Stable sensor rounds to whole grams and publishes after 1.5 s
# without a change in the rounded gram value.
#
# IMPORTANT: replace the MAC below when using another physical scale.
# Keep Wi-Fi credentials in secrets.yaml; never commit secrets.

esphome:
  name: cosori-scale
  friendly_name: Cosori Nutrition Scale

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: WARN
    esp32_ble: WARN
    esp32_ble_client: INFO
    ble_client: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Cosori-Scale-Recovery"
    password: !secret fallback_ap_password

captive_portal:

# BLE tracker required by the direct Cosori BLE client.
# The Bluetooth proxy is intentionally disabled; the scale is connected directly.
esp32_ble_tracker:
  scan_parameters:
    active: true


ble_client:
  - mac_address: "C0:60:40:03:9F:6D"  # Replace for a different scale
    id: cosori_ble
    auto_connect: true
    on_disconnect:
      then:
        - lambda: |-
            id(candidate_valid) = false;

globals:
  - id: candidate_weight_g
    type: int32_t
    initial_value: "0"
  - id: candidate_since_ms
    type: uint32_t
    initial_value: "0"
  - id: candidate_valid
    type: bool
    initial_value: "false"

sensor:
  # Raw decoded value: follows every valid BLE notification, 0.1 g resolution.
  - platform: ble_client
    type: characteristic
    ble_client_id: cosori_ble
    name: "Cosori Weight Raw"
    id: cosori_weight_raw
    unit_of_measurement: "g"
    device_class: weight
    state_class: measurement
    accuracy_decimals: 1
    service_uuid: "1910"
    characteristic_uuid: "2C12"
    notify: true
    lambda: |-
      if (x.size() < 9) {
        ESP_LOGW("cosori", "Ignoring short notification: %u bytes",
                 (unsigned) x.size());
        return NAN;
      }

      // Validate the packet header observed in all captured scale packets.
      if (x[0] != 0xFE || x[1] != 0xEF ||
          x[3] != 0x84 || x[4] != 0xD0 || x[5] != 0x05) {
        ESP_LOGW("cosori", "Ignoring unrecognized notification header");
        return NAN;
      }

      std::string payload_hex;
      char byte_hex[4];
      for (size_t i = 0; i < x.size(); i++) {
        snprintf(byte_hex, sizeof(byte_hex), "%02X", x[i]);
        if (i > 0) payload_hex += " ";
        payload_hex += byte_hex;
      }
      ESP_LOGD("cosori", "BLE RX: %s", payload_hex.c_str());

      const uint16_t raw =
          (static_cast<uint16_t>(x[7]) << 8) |
           static_cast<uint16_t>(x[8]);
      const float weight_g = raw / 10.0f;

      ESP_LOGD("cosori", "Decoded raw=%u, weight=%.1f g", raw, weight_g);
      return weight_g;

    # Start/reset the stability timer when the rounded whole-gram value changes.
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) {
              return;
            }

            // The scale display has 1 g resolution. BLE data is retained
            // at 0.1 g in the Raw sensor; stability is evaluated in whole g.
            const int32_t rounded_g = static_cast<int32_t>(x + 0.5f);

            if (!id(candidate_valid) ||
                rounded_g != id(candidate_weight_g)) {
              id(candidate_weight_g) = rounded_g;
              id(candidate_since_ms) = millis();
              id(candidate_valid) = true;

              ESP_LOGD("cosori",
                       "Stable candidate changed to %d g; 1500 ms timer reset",
                       rounded_g);
            }

  # Stable value: whole grams, published after 1.5 s without a whole-gram change.
  - platform: template
    name: "Cosori Weight Stable"
    id: cosori_weight_stable
    unit_of_measurement: "g"
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(candidate_valid)) {
            return;
          }

          const uint32_t elapsed = millis() - id(candidate_since_ms);
          if (elapsed < 1500U) {
            return;
          }

          const float stable_g = static_cast<float>(id(candidate_weight_g));

          if (!id(cosori_weight_stable).has_state() ||
              static_cast<int32_t>(id(cosori_weight_stable).state) !=
                  id(candidate_weight_g)) {
            id(cosori_weight_stable).publish_state(stable_g);
            ESP_LOGI("cosori",
                     "STABLE PUBLISHED: %.0f g after %u ms without gram change",
                     stable_g,
                     static_cast<unsigned>(elapsed));
          }

# Use "Cosori Weight Stable" in Home Assistant automations.
# "Cosori Weight Raw" remains available for diagnostics.
# No BLE writes are sent to the scale.
